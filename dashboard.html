<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Akkhil Kapoor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        #publishBtn {
            margin-top: 20px;
            padding: 13px 25px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        #publishBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <h2>Blog Admin Dashboard</h2>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <!-- MAIN CONTENT -->

    <div class="container">

        <div class="card">

            <h3>Add New Blog</h3>


            <!-- BLOG FORM -->

            <form id="blogForm">


                <!-- BLOG TITLE -->

                <label>
                    Blog Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter blog title"
                    required
                >


                <!-- BLOG CONTENT -->

                <label>
                    Blog Content
                </label>

                <textarea
                    id="content"
                    placeholder="Write your blog content here..."
                    required
                ></textarea>


                <!-- IMAGE URL -->

                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    id="image_url"
                    placeholder="https://example.com/image.jpg"
                >


                <!-- VIDEO URL -->

                <label>
                    YouTube Video URL
                </label>

                <input
                    type="url"
                    id="video_url"
                    placeholder="https://youtube.com/watch?v=..."
                >


                <!-- STATUS -->

                <label>
                    Blog Status
                </label>

                <select id="status">

                    <option value="true">
                        Published
                    </option>

                    <option value="false">
                        Draft
                    </option>

                </select>


                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    id="publishBtn"
                >
                    Save Blog
                </button>


            </form>


            <!-- MESSAGE -->

            <div id="message"></div>


        </div>

    </div>


    <!-- SUPABASE LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- SUPABASE CONFIGURATION -->

    <script src="js/supabase-config.js"></script>


    <script>


        // =====================================
        // CHECK USER LOGIN
        // =====================================

        async function checkUser() {


            const {

                data: { user },

                error

            } = await supabaseClient.auth.getUser();


            if (error || !user) {


                window.location.href =
                    "admin.html";


                return;


            }


        }


        checkUser();



        // =====================================
        // LOGOUT
        // =====================================

        document
            .getElementById("logoutBtn")
            .addEventListener("click", async function () {


                const { error } =
                    await supabaseClient.auth.signOut();


                if (!error) {


                    window.location.href =
                        "admin.html";


                }


            });



        // =====================================
        // ADD BLOG
        // =====================================

        document
            .getElementById("blogForm")
            .addEventListener("submit", async function (event) {


                event.preventDefault();


                // GET TITLE

                const title =
                    document
                        .getElementById("title")
                        .value
                        .trim();


                // GET CONTENT

                const content =
                    document
                        .getElementById("content")
                        .value
                        .trim();


                // GET IMAGE URL

                const image_url =
                    document
                        .getElementById("image_url")
                        .value
                        .trim();


                // GET VIDEO URL

                const video_url =
                    document
                        .getElementById("video_url")
                        .value
                        .trim();


                // GET STATUS

                const is_published =
                    document
                        .getElementById("status")
                        .value === "true";


                // MESSAGE

                const message =
                    document
                        .getElementById("message");


                // BUTTON

                const publishBtn =
                    document
                        .getElementById("publishBtn");


                message.textContent =
                    "Saving blog...";


                publishBtn.disabled =
                    true;



                // CHECK LOGIN

                const {

                    data: { user }

                } =
                    await supabaseClient.auth.getUser();


                if (!user) {


                    window.location.href =
                        "admin.html";


                    return;


                }



                // CREATE SLUG

                const slug = title
                    .toLowerCase()
                    .trim()
                    .replace(/[^\w\s-]/g, "")
                    .replace(/\s+/g, "-");



                // INSERT BLOG

                const {

                    data,

                    error

                } =
                    await supabaseClient
                        .from("blogs")
                        .insert([

                            {

                                title: title,

                                slug: slug,

                                content: content,

                                image_url:
                                    image_url || null,

                                video_url:
                                    video_url || null,

                                is_published:
                                    is_published

                            }

                        ]);



                // ERROR

                if (error) {


                    message.textContent =
                        "Error: " + error.message;


                    publishBtn.disabled =
                        false;


                    return;


                }



                // SUCCESS

                if (is_published === true) {


                    message.textContent =
                        "Blog published successfully!";


                } else {


                    message.textContent =
                        "Blog saved as draft successfully!";


                }


                // RESET FORM

                document
                    .getElementById("blogForm")
                    .reset();


                publishBtn.disabled =
                    false;


            });


    </script>


</body>

</html>
