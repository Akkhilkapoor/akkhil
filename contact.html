  .grad-text{background:linear-gradient(100deg,var(--c1),var(--c3) 60%,var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; background-size:200% auto; animation:hue 6s ease-in-out infinite alternate;}
  @keyframes hue{ from{background-position:0% center;} to{background-position:100% center;} }
  .aurora{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .blob{position:absolute; border-radius:50%; filter:blur(120px); opacity:0.4;}
  .b1{width:560px; height:560px; background:var(--c1); top:-200px; left:-140px; animation:float1 16s ease-in-out infinite;}
  .b2{width:480px; height:480px; background:var(--c3); top:20%; right:-180px; opacity:0.28; animation:float2 20s ease-in-out infinite;}
  .b3{width:460px; height:460px; background:var(--c2); bottom:-200px; left:25%; opacity:0.2; animation:float3 18s ease-in-out infinite;}
  @keyframes float1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,80px);} }
  @keyframes float2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-70px,50px);} }
  @keyframes float3{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(40px,-60px);} }
  header, main, footer{position:relative; z-index:3;}
  header{position:sticky; top:0; z-index:50; padding:18px 0;}
  nav{max-width:var(--max); margin:0 auto; padding:12px 22px; display:flex; align-items:center; justify-content:space-between; background:rgba(10,10,14,0.6); border:1px solid var(--border); border-radius:100px; backdrop-filter:blur(18px);}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Sora',sans-serif; font-weight:700; font-size:16px;}
  .brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,var(--c1),var(--c3)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'JetBrains Mono',monospace;}
  .navlinks{display:flex; gap:30px; font-size:14px; font-weight:500; color:var(--dim);}
  .navlinks a{position:relative;}
  .navlinks a::after{content:""; position:absolute; left:0; bottom:-4px; width:0; height:1px; background:var(--c2); transition:width .25s;}
  .navlinks a:hover::after, .navlinks a.active::after{width:100%;}
  .navlinks a:hover, .navlinks a.active{color:var(--text);}
  .nav-cta{background:var(--text); color:#07070B; font-weight:600; font-size:13.5px; padding:10px 20px; border-radius:100px; transition:transform .2s;}
  .nav-cta:hover{transform:scale(1.05);}
  .page-hero{padding:80px 0 20px; text-align:center;}
  .kicker{display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:100px; padding:8px 16px; font-size:12.5px; font-family:'JetBrains Mono',monospace; color:var(--dim); margin-bottom:22px;}
  .kicker .dot{width:6px; height:6px; border-radius:50%; background:var(--c2); box-shadow:0 0 10px var(--c2);}
  .page-hero h1{font-size:clamp(34px,5.4vw,56px); font-weight:700; line-height:1.1;}
  main{padding:60px 0 100px;}
  .contact-card{max-width:640px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:44px;}
  .contact-form{display:flex; flex-direction:column; gap:16px;}
  .contact-form input, .contact-form textarea{
    background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px;
    outline:none; transition:border-color .2s;
  }
  .contact-form input::placeholder, .contact-form textarea::placeholder{color:var(--dimmer);}
  .contact-form input:focus, .contact-form textarea:focus{border-color:var(--c1);}
  .contact-form textarea{resize:vertical;}
  .contact-form button{
    background:linear-gradient(135deg,var(--c1),var(--c3)); color:#08080B; font-weight:700; font-size:14.5px;
    padding:15px; border:none; border-radius:100px; cursor:pointer; margin-top:6px; transition:transform .2s;
  }
  .contact-form button:hover{transform:translateY(-2px);}
  #contactStatus{text-align:center; margin-top:10px; font-weight:600; font-size:13.5px; color:var(--c2);}
  footer{padding:34px 0; border-top:1px solid var(--border); font-size:13px; color:var(--dimmer); text-align:center;}
  footer a{text-decoration:underline; color:var(--dimmer);}
  @media (max-width:860px){ .navlinks{display:none;} .contact-card{padding:28px;} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  .page-hero{animation:fadeUp .7s ease both;}
  .contact-card{animation:fadeUp .8s ease .1s both;}

<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  const contactForm = document.getElementById("contactForm");
  const contactStatus = document.getElementById("contactStatus");

  contactForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("contactName").value.trim();
    const email = document.getElementById("contactEmail").value.trim();
    const phone = document.getElementById("contactPhone").value.trim();
    const message = document.getElementById("contactMessage").value.trim();

    const whatsappMessage = `New Contact Message\n\nName: ${name}\nEmail: ${email}\nPhone: ${phone}\n\nMessage:\n${message}`;
    const whatsappURL = "https://wa.me/919729590777?text=" + encodeURIComponent(whatsappMessage);

    contactStatus.textContent = "Opening WhatsApp...";
    window.location.href = whatsappURL;
  });
</script>
