<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Contact Page Specific SEO Tags -->
    <title>Contact Me | Akkhil Kapoor</title>
    <meta name="description" content="Get in touch with Akkhil Kapoor. Send a message for inquiries regarding Tally Prime, Advanced Excel, Web Development, and Graphic Designing courses.">

    <link rel="stylesheet" href="style.css">

    <!-- FontAwesome for Header Responsive Menu Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- ===============================
         HEADER & NAVIGATION
    =============================== -->
    <header class="site-header">
        <div class="nav-container">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor" width="30" height="30">
                    <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM4.15 13.51C5.9 15.61 8.71 17 12 17s6.1-1.39 7.85-3.49L12 17.82l-7.85-4.31z" />
                </svg>
                <span>Akkhil Portfolio</span>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button class="menu-toggle" id="mobileMenuBtn" aria-label="Toggle Navigation">
                <i class="fas fa-bars"></i>
            </button>

            <nav aria-label="Main Navigation" id="mainNav">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="expertise.html">Expertise</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="blog.html">Blog</a>
                    <li><a href="blog.html">Blog</a>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ===============================
         MAIN CONTENT
    =============================== -->
    <main class="main-content-padding">
        <section id="contact">
            <h2>Contact Me</h2>

            <!-- CONTACT FORM -->
            <form id="contactForm" class="contact-form">
                <input type="text" id="contactName" name="Name" placeholder="Your Name" required>
                <input type="email" id="contactEmail" name="Email" placeholder="Your Email" required>
                <input type="text" id="contactPhone" name="Phone" placeholder="Phone Number" required>
                <textarea id="contactMessage" name="Message" rows="6" placeholder="Write your message here..." required></textarea>

                <button type="submit" id="sendMessageBtn">Send Message</button>

                <!-- STATUS MESSAGE -->
                <p id="contactStatus" style="text-align: center; margin-top: 10px; font-weight: 600;"></p>
            </form>
        </section>
    </main>

    <!-- ===============================
         FOOTER
    =============================== -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 Akkhil Kapoor. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- ===============================
         SUPABASE EDGE FUNCTION + WHATSAPP
    =============================== -->
    <script>
        const contactForm = document.getElementById("contactForm");
        const sendMessageBtn = document.getElementById("sendMessageBtn");
        const contactStatus = document.getElementById("contactStatus");

        contactForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("contactName").value.trim();
            const email = document.getElementById("contactEmail").value.trim();
            const phone = document.getElementById("contactPhone").value.trim();
            const message = document.getElementById("contactMessage").value.trim();

            const whatsappMessage = `New Contact Message\n\nName: ${name}\nEmail: ${email}\nPhone: ${phone}\n\nMessage:\n${message}`;

            const whatsappURL = "https://wa.me/919729590777?text=" + encodeURIComponent(whatsappMessage);

            contactStatus.style.color = "green";
            contactStatus.textContent = "Opening WhatsApp...";

            window.location.href = whatsappURL;
        });

        // Mobile Navigation
        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
        const mainNav = document.getElementById("mainNav");

        mobileMenuBtn.addEventListener("click", function() {
            mainNav.classList.toggle("open");
            const icon = mobileMenuBtn.querySelector("i");

            if (mainNav.classList.contains("open")) {
                icon.classList.remove("fa-bars");
                icon.classList.add("fa-times");
            } else {
                icon.classList.remove("fa-times");
                icon.classList.add("fa-bars");
            }
        });
    </script>
</body>

</html>
