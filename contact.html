        <section id="contact">
            <h2>Contact Me</h2>

                <input type="text" id="contactName" name="Name" placeholder="Your Name" required>
                <input type="email" id="contactEmail" name="Email" placeholder="Your Email" required>
                <input type="text" id="contactPhone" name="Phone" placeholder="Phone Number" required>
                <textarea id="contactMessage" name="Message" rows="6" placeholder="Write your message here..." required></textarea>

                <button type="submit" id="sendMessageBtn">Send Message</button>

<script>

    <script>
        const contactForm = document.getElementById("contactForm");
        const sendMessageBtn = document.getElementById("sendMessageBtn");
        const contactStatus = document.getElementById("contactStatus");

        contactForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("contactName").value.trim();
            const email = document.getElementById("contactEmail").value.trim();
            const phone = document.getElementById("contactPhone").value.trim();
            const message = document.getElementById("contactMessage").value.trim();

            const whatsappMessage = `New Contact Message\n\nName: ${name}\nEmail: ${email}\nPhone: ${phone}\n\nMessage:\n${message}`;
            const whatsappURL = "https://wa.me/919729590777?text=" + encodeURIComponent(whatsappMessage);

            contactStatus.style.color = "green";
            contactStatus.textContent = "Opening WhatsApp...";

            window.location.href = whatsappURL;
        });

        const mobileMenuBtn = document.getElementById("mobileMenuBtn");
        const mainNav = document.getElementById("mainNav");

        mobileMenuBtn.addEventListener("click", function() {
            mainNav.classList.toggle("open");
            const icon = mobileMenuBtn.querySelector("i");

            if (mainNav.classList.contains("open")) {
                icon.classList.remove("fa-bars");
                icon.classList.add("fa-times");
            } else {
                icon.classList.remove("fa-times");
                icon.classList.add("fa-bars");
            }
        });
    </script>
