<!-- ===============================
     SUPABASE EDGE FUNCTION + WHATSAPP
=============================== -->

<script>


    /*
    =====================================
    SUPABASE EDGE FUNCTION URL
    =====================================
    */


    const EDGE_FUNCTION_URL =
        "https://lmkvtvmkbvpzgsrutheu.supabase.co/functions/v1/send-contact-message";


    /*
    =====================================
    DOM ELEMENTS
    =====================================
    */


    const contactForm =
        document.getElementById(
            "contactForm"
        );


    const sendMessageBtn =
        document.getElementById(
            "sendMessageBtn"
        );


    const contactStatus =
        document.getElementById(
            "contactStatus"
        );


    /*
    =====================================
    CONTACT FORM SUBMIT
    =====================================
    */


    contactForm.addEventListener(

        "submit",

        async function(event) {


            event.preventDefault();


            /*
            ==============================
            GET FORM VALUES
            ==============================
            */


            const name =
                document
                .getElementById(
                    "contactName"
                )
                .value
                .trim();


            const email =
                document
                .getElementById(
                    "contactEmail"
                )
                .value
                .trim();


            const phone =
                document
                .getElementById(
                    "contactPhone"
                )
                .value
                .trim();


            const message =
                document
                .getElementById(
                    "contactMessage"
                )
                .value
                .trim();


            /*
            ==============================
            BUTTON LOADING STATE
            ==============================
            */


            sendMessageBtn.disabled =
                true;


            sendMessageBtn.textContent =
                "Sending...";


            contactStatus.textContent =
                "";


            contactStatus.style.color =
                "";


            try {


                /*
                ==============================
                SEND DATA TO SUPABASE
                ==============================
                */


                const response =
                    await fetch(

                        EDGE_FUNCTION_URL,

                        {

                            method:
                                "POST",


                            headers: {

                                "Content-Type":
                                    "application/json"

                            },


                            body:

                                JSON.stringify(

                                    {

                                        name:
                                            name,

                                        email:
                                            email,

                                        phone:
                                            phone,

                                        message:
                                            message

                                    }

                                )

                        }

                    );


                /*
                ==============================
                RESPONSE CHECK
                ==============================
                */


                if (

                    !response.ok

                ) {

                    throw new Error(

                        "Message sending failed"

                    );

                }


                /*
                ==============================
                SUCCESS MESSAGE
                ==============================
                */


                contactStatus.style.color =
                    "green";


                contactStatus.textContent =
                    "Thank you! Your message has been sent successfully.";


                /*
                ==============================
                OPEN WHATSAPP
                ==============================
                */


                const whatsappMessage = `
```

New Contact Message

Name: ${name}

Email: ${email}

Phone: ${phone}

Message:

${message}

```
                `;


                const whatsappURL =

                    `https://wa.me/919729590777?text=${encodeURIComponent(

                        whatsappMessage

                    )}`;


                window.open(

                    whatsappURL,

                    "_blank"

                );


                /*
                ==============================
                RESET FORM
                ==============================
                */


                contactForm.reset();


            }


            catch (

                error

            ) {


                console.error(

                    "Contact form error:",

                    error

                );


                contactStatus.style.color =
                    "red";


                contactStatus.textContent =
                    "Something went wrong. Please try again.";


            }


            finally {


                /*
                ==============================
                RESET BUTTON
                ==============================
                */


                sendMessageBtn.disabled =
                    false;


                sendMessageBtn.textContent =
                    "Send Message";


            }


        }

    );


    /*
    =====================================
    MOBILE NAVIGATION
    =====================================
    */


    const mobileMenuBtn =
        document.getElementById(
            "mobileMenuBtn"
        );


    const mainNav =
        document.getElementById(
            "mainNav"
        );


    mobileMenuBtn.addEventListener(

        "click",

        function() {


            mainNav.classList.toggle(

                "open"

            );


            const icon =
                mobileMenuBtn.querySelector(

                    "i"

                );


            if (

                mainNav.classList.contains(

                    "open"

                )

            ) {


                icon.classList.remove(

                    "fa-bars"

                );


                icon.classList.add(

                    "fa-times"

                );


            }


            else {


                icon.classList.remove(

                    "fa-times"

                );


                icon.classList.add(

                    "fa-bars"

                );


            }


        }

    );


</script>
