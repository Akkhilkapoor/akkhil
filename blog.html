<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blogs | Akkhil Kapoor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .blogs-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );

            gap: 25px;
        }

        .blog-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .blog-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .blog-content {
            padding: 20px;
        }

        .blog-content h2 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .blog-content p {
            color: #4b5563;
            line-height: 1.6;
        }

        .read-more {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 16px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .no-blogs {
            text-align: center;
            color: #6b7280;
        }

        .loading {
            text-align: center;
        }

    </style>

</head>


<body>


    <header>
<!-- ===============================
         HEADER & NAVIGATION
    =============================== -->
    <header class="site-header">
        <div class="nav-container">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="currentColor" width="30" height="30">
                    <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM4.15 13.51C5.9 15.61 8.71 17 12 17s6.1-1.39 7.85-3.49L12 17.82l-7.85-4.31z" />
                </svg>
                <span>Akkhil Portfolio</span>
            </div>

            <button class="menu-toggle" id="mobileMenuBtn" aria-label="Toggle Navigation">
                <i class="fas fa-bars"></i>
            </button>

            <nav aria-label="Main Navigation" id="mainNav">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html" class="active">About</a></li>
                    <li><a href="expertise.html">Expertise</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
        <h1>
            My Blogs
        </h1>

        <p>
            Latest articles and updates
        </p>

    </header>


    <div class="container">


        <div
            id="blogsGrid"
            class="blogs-grid"
        >

            <p class="loading">
                Loading blogs...
            </p>

        </div>


    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- YOUR SUPABASE CONFIG -->

    <script src="js/supabase-config.js"></script>



    <script>


        async function loadPublishedBlogs() {


            const blogsGrid =
                document.getElementById(
                    "blogsGrid"
                );


            const {

                data: blogs,

                error

            } =
                await supabaseClient
                    .from("blogs")
                    .select("*")
                    .eq(
                        "is_published",
                        true
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {


                blogsGrid.innerHTML = `

                    <p class="no-blogs">

                        Error loading blogs:
                        ${error.message}

                    </p>

                `;


                return;


            }


            if (
                !blogs
                ||
                blogs.length === 0
            ) {


                blogsGrid.innerHTML = `

                    <p class="no-blogs">

                        No published blogs available.

                    </p>

                `;


                return;


            }


            blogsGrid.innerHTML =
                "";


            blogs.forEach(
                function(blog) {


                    const blogCard =
                        document.createElement(
                            "div"
                        );


                    blogCard.className =
                        "blog-card";


                    const imageHTML =
                        blog.image_url
                            ? `

                                <img
                                    src="${blog.image_url}"
                                    alt="${blog.title}"
                                >

                            `
                            : "";


                    const shortContent =
                        blog.content
                            .substring(
                                0,
                                150
                            )
                            + "...";


                    blogCard.innerHTML = `

                        ${imageHTML}

                        <div
                            class="blog-content"
                        >

                            <h2>
                                ${blog.title}
                            </h2>

                            <p>
                                ${shortContent}
                            </p>

                           <a
    class="read-more"
    href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}"
>
    Read More
</a>

                        </div>

                    `;


                    blogsGrid.appendChild(
                        blogCard
                    );


                }
            );


        }


        loadPublishedBlogs();


    </script>


</body>

</html>
