     JAVASCRIPT
=============================== -->

<script>


    /* =====================================
       MOBILE MENU
    ===================================== */


    const mobileMenuBtn =
        document.getElementById("mobileMenuBtn");


    const mainNav =
        document.getElementById("mainNav");


    if (mobileMenuBtn && mainNav) {

        mobileMenuBtn.addEventListener(
            "click",
            function () {

                mainNav.classList.toggle("open");


                const icon =
                    mobileMenuBtn.querySelector("i");


                if (
                    mainNav.classList.contains("open")
                ) {

                    icon.classList.remove("fa-bars");

                    icon.classList.add("fa-times");

                }

                else {

                    icon.classList.remove("fa-times");

                    icon.classList.add("fa-bars");

                }

            }
        );

    }


    /* =====================================
       LOAD PUBLISHED BLOGS
    ===================================== */


    async function loadPublishedBlogs() {


        const blogsGrid =
            document.getElementById("blogsGrid");


        try {


            const {

                data: blogs,

                error

            } = await supabaseClient

                .from("blogs")

                .select("*")

                .eq(
                    "is_published",
                    true
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                throw error;

            }


            if (
                !blogs ||
                blogs.length === 0
            ) {


                blogsGrid.innerHTML = `

                    <p class="no-blogs">

                        No published blogs available.

                    </p>

                `;


                return;

            }


            blogsGrid.innerHTML = "";


            blogs.forEach(function (blog) {


                const blogCard =
                    document.createElement("article");


                blogCard.className =
                    "blog-card";


                let imageHTML = "";


                if (
                    blog.image_url
                ) {


                    imageHTML = `

                        <img

                            src="${escapeHTML(
                                blog.image_url
                            )}"

                            alt="${escapeHTML(
                                blog.title
                            )}"

                            loading="lazy"

                        >

                    `;

                }


                const shortContent =

                    blog.content

                        ? stripHTML(
                            blog.content
                        )

                        .substring(
                            0,
                            150
                        ) + "..."

                        : "Read this blog to learn more.";


                blogCard.innerHTML = `


                    ${imageHTML}


                    <div class="blog-content">


                        <h2>

                            ${escapeHTML(
                                blog.title
                            )}

                        </h2>


                        <p>

                            ${escapeHTML(
                                shortContent
                            )}

                        </p>


                        <a

                            href="blog-detail.html?slug=${encodeURIComponent(
                                blog.slug
                            )}"

                            class="read-more"

                        >

                            Read More

                            <i
                                class="fas fa-arrow-right"
                                style="margin-left: 8px;"
                            ></i>

                        </a>


                    </div>


                `;


                blogsGrid.appendChild(
                    blogCard
                );


            });


        }


        catch (error) {


            console.error(
                "Error loading blogs:",
                error
            );


            blogsGrid.innerHTML = `

                <p class="no-blogs">

                    Unable to load blogs.
                    Please try again later.

                </p>

            `;

        }

    }


    /* =====================================
       REMOVE HTML TAGS
    ===================================== */


    function stripHTML(
        html
    ) {


        const div =
            document.createElement(
                "div"
            );


        div.innerHTML =
            html || "";


        return div.textContent ||
            div.innerText ||
            "";

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */


    function escapeHTML(
        text
    ) {


        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text || "";


        return div.innerHTML;

    }


    /* =====================================
       START
    ===================================== */


    loadPublishedBlogs();


</script>
