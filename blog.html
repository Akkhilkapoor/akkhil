<style>
  :root{
    --bg:#07070B; --surface:rgba(255,255,255,0.045); --border:rgba(255,255,255,0.10);
    --text:#F3F2F8; --dim:rgba(243,242,248,0.62); --dimmer:rgba(243,242,248,0.4);

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; position:relative;}
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}
  h1,h2,h3{font-family:'Sora', sans-serif; letter-spacing:-0.02em;}
  .grad-text{background:linear-gradient(100deg,var(--c1),var(--c3) 60%,var(--c2)); -webkit-background-clip:text; background-clip:text; color:transparent; background-size:200% auto; animation:hue 6s ease-in-out infinite alternate;}
  @keyframes hue{ from{background-position:0% center;} to{background-position:100% center;} }
  .aurora{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .blob{position:absolute; border-radius:50%; filter:blur(120px); opacity:0.4;}
  .b1{width:560px; height:560px; background:var(--c1); top:-200px; left:-140px; animation:float1 16s ease-in-out infinite;}
  .b2{width:480px; height:480px; background:var(--c3); top:20%; right:-180px; opacity:0.28; animation:float2 20s ease-in-out infinite;}
  .b3{width:460px; height:460px; background:var(--c2); bottom:-200px; left:25%; opacity:0.2; animation:float3 18s ease-in-out infinite;}
  @keyframes float1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,80px);} }
  @keyframes float2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-70px,50px);} }
  @keyframes float3{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(40px,-60px);} }
  header, main, footer{position:relative; z-index:3;}
  header{position:sticky; top:0; z-index:50; padding:18px 0;}
  nav{max-width:var(--max); margin:0 auto; padding:12px 22px; display:flex; align-items:center; justify-content:space-between; background:rgba(10,10,14,0.6); border:1px solid var(--border); border-radius:100px; backdrop-filter:blur(18px);}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Sora',sans-serif; font-weight:700; font-size:16px;}
  .brand-mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,var(--c1),var(--c3)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'JetBrains Mono',monospace;}
  .navlinks{display:flex; gap:30px; font-size:14px; font-weight:500; color:var(--dim);}
  .navlinks a{position:relative;}
  .navlinks a::after{content:""; position:absolute; left:0; bottom:-4px; width:0; height:1px; background:var(--c2); transition:width .25s;}
  .navlinks a:hover::after, .navlinks a.active::after{width:100%;}
  .navlinks a:hover, .navlinks a.active{color:var(--text);}
  .nav-cta{background:var(--text); color:#07070B; font-weight:600; font-size:13.5px; padding:10px 20px; border-radius:100px; transition:transform .2s;}
  .nav-cta:hover{transform:scale(1.05);}
  .page-hero{padding:80px 0 20px; text-align:center;}
  .kicker{display:inline-flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:100px; padding:8px 16px; font-size:12.5px; font-family:'JetBrains Mono',monospace; color:var(--dim); margin-bottom:22px;}
  .kicker .dot{width:6px; height:6px; border-radius:50%; background:var(--c2); box-shadow:0 0 10px var(--c2);}
  .page-hero h1{font-size:clamp(34px,5.4vw,56px); font-weight:700; line-height:1.1; margin-bottom:14px;}
  .page-hero p{color:var(--dim); font-size:16px;}
  main{padding:60px 0 100px;}
  .blogs-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:20px;}
  .blog-card{background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; transition:transform .2s, border-color .3s; cursor:pointer;}
  .blog-card:hover{transform:translateY(-5px); border-color:rgba(255,255,255,0.25);}
  .blog-card img{width:100%; height:200px; object-fit:cover; background:var(--surface);}
  .blog-content{padding:22px; display:flex; flex-direction:column; flex-grow:1;}
  .blog-content h2{font-size:18px; font-weight:600; margin-bottom:10px;}
  .blog-content p{color:var(--dim); font-size:14px; line-height:1.6; flex-grow:1;}
  .read-more{display:inline-flex; align-items:center; margin-top:16px; padding:10px 18px; background:linear-gradient(135deg,var(--c1),var(--c3)); color:#08080B; text-decoration:none; border-radius:100px; font-weight:700; font-size:13px; align-self:flex-start;}
  .no-blogs, .loading{grid-column:1/-1; text-align:center; color:var(--dim); padding:50px 0; font-size:15px;}
  footer{padding:34px 0; border-top:1px solid var(--border); font-size:13px; color:var(--dimmer); text-align:center;}
  footer a{text-decoration:underline; color:var(--dimmer);}
  @media (max-width:860px){ .navlinks{display:none;} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  .page-hero{animation:fadeUp .8s ease both;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  async function loadPublishedBlogs() {
    const blogsGrid = document.getElementById("blogsGrid");

    const { data: blogs, error } = await supabaseClient
      .from("blogs")
      .select("*")
      .eq("is_published", true)
      .order("created_at", { ascending: false });

    if (error) {
      blogsGrid.innerHTML = `<p class="no-blogs">Error loading blogs: ${error.message}</p>`;
      return;
    }

    if (!blogs || blogs.length === 0) {
      blogsGrid.innerHTML = `<p class="no-blogs">No published blogs available.</p>`;
      return;
    }

    blogsGrid.innerHTML = "";

    blogs.forEach(function(blog) {
      const blogCard = document.createElement("div");
      blogCard.className = "blog-card";
      blogCard.style.animation = "fadeUp .6s ease both";

      blogCard.addEventListener("click", function () {
        window.location.href = "blog-detail.html?slug=" + encodeURIComponent(blog.slug);
      });

      const imageHTML = blog.image_url
        ? `<img src="${escapeHTML(blog.image_url)}" alt="${escapeHTML(blog.title)} by Akkhil Kapoor">`
        : "";

      const shortContent = blog.content
        ? stripHTML(blog.content).substring(0, 150) + "..."
        : "";

      blogCard.innerHTML = `
        ${imageHTML}
        <div class="blog-content">
          <h2>${escapeHTML(blog.title)}</h2>
          <p>${escapeHTML(shortContent)}</p>
          <a class="read-more" href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}">Read More →</a>
        </div>
      `;

      blogsGrid.appendChild(blogCard);
    });
  }

  function stripHTML(html) {
    const div = document.createElement("div");
    div.innerHTML = html || "";
    return div.textContent || div.innerText || "";
  }

  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
  }

  loadPublishedBlogs();
</script>
