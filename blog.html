<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog | Akkhil Kapoor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        #blogContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .blog-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .blog-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .blog-content {
            padding: 20px;
        }

        .blog-content h2 {
            margin-top: 0;
        }

        .date {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .read-more {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 16px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .no-image {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e5e7eb;
            color: #6b7280;
        }

        #message {
            text-align: center;
            margin: 30px 0;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>My Blog</h1>

        <div id="message">
            Loading blogs...
        </div>

        <div id="blogContainer"></div>

    </div>


    <!-- Supabase Library -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase Configuration -->

    <script src="js/supabase-config.js"></script>


    <script>


        async function loadBlogs() {


            const message =
                document.getElementById("message");


            const blogContainer =
                document.getElementById("blogContainer");


            const {

                data: blogs,

                error

            } =
                await supabaseClient
                    .from("blogs")
                    .select("*")
                    .eq("is_published", true)
                    .order("created_at", {
                        ascending: false
                    });


            if (error) {


                message.textContent =
                    "Error loading blogs";


                console.error(error);


                return;


            }


            if (!blogs || blogs.length === 0) {


                message.textContent =
                    "No published blogs found.";


                return;


            }


            message.textContent = "";


            blogs.forEach(function(blog) {


                const card =
                    document.createElement("div");


                card.className =
                    "blog-card";


                let imageHTML = "";


                if (blog.image_url) {


                    imageHTML = `

                        <img
                            src="${blog.image_url}"
                            alt="${blog.title}"
                        >

                    `;


                } else {


                    imageHTML = `

                        <div class="no-image">
                            No Image
                        </div>

                    `;


                }


                card.innerHTML = `

                    ${imageHTML}

                    <div class="blog-content">

                        <h2>
                            ${blog.title}
                        </h2>

                        <div class="date">

                            ${new Date(
                                blog.created_at
                            ).toLocaleDateString()}

                        </div>

                        <p>

                            ${blog.content.substring(
                                0,
                                180
                            )}

                            ...

                        </p>

                        <a
                            href="blog-detail.html?slug=${blog.slug}"
                            class="read-more"
                        >

                            Read More

                        </a>

                    </div>

                `;


                blogContainer.appendChild(card);


            });


        }


        loadBlogs();


    </script>


</body>

</html>
