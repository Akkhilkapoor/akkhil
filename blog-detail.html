    <style>


        /* ===============================
           BLOG DETAIL PAGE
        =============================== */


        .blog-detail-section {

            padding: 50px 20px;

            max-width: 1000px;

            margin: 0 auto;

        }


        .blog-detail-container {

            background: #ffffff;

            padding: 35px;

            border-radius: 12px;

            box-shadow:

                0 5px 20px

                rgba(

                    0,

                    0,

                    0,

                    0.08

                );

        }


        /* ===============================
           BACK BUTTON
        =============================== */


        .back-to-blogs {

            display: inline-block;

            margin-bottom: 25px;

            padding: 10px 18px;

            background: #007bff;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-weight: bold;

            transition: 0.3s;

        }


        .back-to-blogs:hover {

            background: #0056b3;

        }


        /* ===============================
           BLOG TITLE
        =============================== */


        .blog-detail-title {

            font-size: 42px;

            line-height: 1.25;

            margin-top: 0;

            margin-bottom: 15px;

        }


        /* ===============================
           BLOG DATE
        =============================== */


        .blog-date {

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        /* ===============================
           BLOG IMAGE
        =============================== */


        .blog-detail-image {

            width: 100%;

            max-height: 550px;

            object-fit: cover;

            border-radius: 10px;

            display: block;

            margin-bottom: 30px;

        }


        /* ===============================
           BLOG CONTENT
        =============================== */


        .blog-detail-content {

            font-size: 18px;

            line-height: 1.8;

            color: #333;

            overflow-wrap: break-word;

        }


        .blog-detail-content h1,

        .blog-detail-content h2,

        .blog-detail-content h3 {

            margin-top: 30px;

            margin-bottom: 15px;

        }


        .blog-detail-content p {

            margin-bottom: 18px;

        }


        .blog-detail-content ul,

        .blog-detail-content ol {

            margin-bottom: 20px;

            padding-left: 30px;

        }


        .blog-detail-content a {

            color: #007bff;

            text-decoration: underline;

        }


        .blog-detail-content img {

            max-width: 100%;

            height: auto;

            border-radius: 8px;

            margin: 20px 0;

        }


        /* ===============================
           VIDEO
        =============================== */


        .blog-video {

            margin-top: 35px;

        }


        .blog-video h3 {

            margin-bottom: 15px;

        }


        .blog-video iframe {

            width: 100%;

            height: 500px;

            border: none;

            border-radius: 10px;

        }


        /* ===============================
           LOADING / ERROR
        =============================== */


        .blog-loading,

        .blog-error {

            text-align: center;

            padding: 60px 20px;

        }


        .blog-error {

            color: red;

        }


        /* ===============================
           RESPONSIVE
        =============================== */


        @media (

            max-width: 768px

        ) {


            .blog-detail-section {

                padding: 30px 15px;

            }


            .blog-detail-container {

                padding: 22px;

            }


            .blog-detail-title {

                font-size: 30px;

            }


            .blog-detail-content {

                font-size: 16px;

            }


            .blog-video iframe {

                height: 260px;

            }


        }


    </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ===============================
         SUPABASE BLOG SYSTEM
    =============================== -->


    <script>


        



        const blogContainer =

            document.getElementById(

                "blogContainer"

            );



        async function loadBlog() {


            const urlParams =

                new URLSearchParams(

                    window.location.search

                );


            const slug =

                urlParams.get(

                    "slug"

                );



            if (

                !slug

            ) {


                showError(

                    "Blog not found."

                );


                return;


            }



            try {


                const response =

                    await fetch(


                        `${SUPABASE_URL}/rest/v1/blogs?slug=eq.${encodeURIComponent(slug)}&is_published=eq.true&select=*`,


                        {


                            method: "GET",


                            headers: {


                                "apikey":

                                    SUPABASE_KEY,


                                "Authorization":

                                    `Bearer ${SUPABASE_KEY}`


                            }


                        }


                    );



                if (

                    !response.ok

                ) {


                    throw new Error(

                        "Failed to load blog"

                    );


                }



                const blogs =

                    await response.json();



                if (

                    !blogs

                    ||

                    blogs.length === 0

                ) {


                    showError(

                        "Blog not found."

                    );


                    return;


                }



                const blog =

                    blogs[0];



                let imageHTML = "";



                if (

                    blog.image_url

                ) {


                    imageHTML = `


                        <img

                            src="${escapeHTML(

                                blog.image_url

                            )}"

                            alt="${escapeHTML(

                                blog.title

                            )}"

                            class="blog-detail-image"

                        >


                    `;


                }



                let dateHTML = "";



                if (

                    blog.created_at

                ) {


                    const date =

                        new Date(

                            blog.created_at

                        );



                    dateHTML = `


                        <div class="blog-date">


                            <i

                                class="far fa-calendar-alt"

                            ></i>


                            ${date.toLocaleDateString(

                                "en-IN",

                                {

                                    day: "numeric",

                                    month: "long",

                                    year: "numeric"

                                }

                            )}


                        </div>


                    `;


                }



                let videoHTML = "";



                if (

                    blog.video_url

                ) {


                    const videoId =

                        getYouTubeVideoId(

                            blog.video_url

                        );



                    if (

                        videoId

                    ) {


                        videoHTML = `


                            <div class="blog-video">


                                <h3>


                                    <i

                                        class="fab fa-youtube"

                                    ></i>


                                    Related Video


                                </h3>



                                <iframe

                                    src="https://www.youtube.com/embed/${videoId}"

                                    title="${escapeHTML(

                                        blog.title

                                    )}"

                                    allowfullscreen

                                ></iframe>


                            </div>


                        `;


                    }

                }



                blogContainer.innerHTML = `


                    <a

                        href="blog.html"

                        class="back-to-blogs"

                    >


                        <i

                            class="fas fa-arrow-left"

                        ></i>


                        Back to Blogs


                    </a>



                    <h1

                        class="blog-detail-title"

                    >

                        ${escapeHTML(

                            blog.title

                        )}


                    </h1>



                    ${dateHTML}



                    ${imageHTML}



                    <div

                        class="blog-detail-content"

                    >

                        ${blog.content}


                    </div>



                    ${videoHTML}


                `;



                document.title =

                    blog.title

                    +

                    " | Akkhil Kapoor";



            }


            catch (

                error

            ) {


                console.error(

                    "Error loading blog:",

                    error

                );


                showError(

                    "Failed to load blog. Please try again later."

                );


            }


        }



        function getYouTubeVideoId(

            url

        ) {


            let videoId = "";



            try {


                const urlObject =

                    new URL(

                        url

                    );



                if (

                    urlObject.hostname.includes(

                        "youtube.com"

                    )

                ) {


                    videoId =

                        urlObject.searchParams.get(

                            "v"

                        );


                }


                else if (

                    urlObject.hostname.includes(

                        "youtu.be"

                    )

                ) {


                    videoId =

                        urlObject.pathname.substring(

                            1

                        );

                }


            }


            catch (

                error

            ) {


                console.error(

                    "Invalid YouTube URL"

                );


            }



            return videoId;


        }



        function showError(

            message

        ) {


            blogContainer.innerHTML = `


                <div

                    class="blog-error"

                >


                    <i

                        class="fas fa-exclamation-triangle"

                    ></i>



                    <h2>


                        ${message}


                    </h2>



                    <a

                        href="blog.html"

                        class="back-to-blogs"

                    >


                        Back to Blogs


                    </a>


                </div>


            `;


        }



        function escapeHTML(

            text

        ) {


            const div =

                document.createElement(

                    "div"

                );



            div.textContent =

                text || "";



            return div.innerHTML;


        }



        /* ===============================
           MOBILE MENU
        =============================== */


        const mobileMenuBtn =

            document.getElementById(

                "mobileMenuBtn"

            );


        const mainNav =

            document.getElementById(

                "mainNav"

            );



        mobileMenuBtn.addEventListener(

            "click",

            function() {


                mainNav.classList.toggle(

                    "open"

                );



                const icon =

                    mobileMenuBtn.querySelector(

                        "i"

                    );



                if (

                    mainNav.classList.contains(

                        "open"

                    )

                ) {


                    icon.classList.remove(

                        "fa-bars"

                    );


                    icon.classList.add(

                        "fa-times"

                    );

                }

                else {


                    icon.classList.remove(

                        "fa-times"

                    );


                    icon.classList.add(

                        "fa-bars"

                    );

                }


            }

        );



        loadBlog();
