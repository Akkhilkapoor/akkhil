<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog | Akkhil Kapoor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .blog-detail {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .date {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .featured-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .content {
            font-size: 18px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .video {
            margin-top: 30px;
        }

        .video iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 10px;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        #message {
            text-align: center;
            padding: 30px;
        }

    </style>

</head>


<body>


    <div class="container">

        <div id="message">
            Loading blog...
        </div>


        <article
            class="blog-detail"
            id="blogDetail"
            style="display: none;"
        >

            <h1 id="blogTitle"></h1>

            <div
                class="date"
                id="blogDate"
            ></div>


            <img
                id="blogImage"
                class="featured-image"
                style="display: none;"
            >


            <div
                class="content"
                id="blogContent"
            ></div>


            <div
                class="video"
                id="videoContainer"
                style="display: none;"
            >

                <iframe
                    id="videoFrame"
                    allowfullscreen
                ></iframe>

            </div>


            <a
                href="blog.html"
                class="back-button"
            >
                ← Back to Blogs
            </a>

        </article>

    </div>


    <!-- Supabase Library -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase Configuration -->

    <script src="js/supabase-config.js"></script>


    <script>


        async function loadBlog() {


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const slug =
                params.get("slug");


            const message =
                document.getElementById(
                    "message"
                );


            if (!slug) {


                message.textContent =
                    "Blog not found.";


                return;


            }


            const {

                data: blog,

                error

            } =
                await supabaseClient
                    .from("blogs")
                    .select("*")
                    .eq("slug", slug)
                    .eq("is_published", true)
                    .single();


            if (error || !blog) {


                message.textContent =
                    "Blog not found.";


                return;


            }


            message.style.display =
                "none";


            document
                .getElementById(
                    "blogDetail"
                )
                .style.display =
                "block";


            document
                .getElementById(
                    "blogTitle"
                )
                .textContent =
                blog.title;


            document
                .getElementById(
                    "blogDate"
                )
                .textContent =
                new Date(
                    blog.created_at
                ).toLocaleDateString();


            document
                .getElementById(
                    "blogContent"
                )
                .textContent =
                blog.content;


            if (blog.image_url) {


                const image =
                    document.getElementById(
                        "blogImage"
                    );


                image.src =
                    blog.image_url;


                image.alt =
                    blog.title;


                image.style.display =
                    "block";


            }


            if (blog.video_url) {


                const videoId =
                    getYouTubeVideoId(
                        blog.video_url
                    );


                if (videoId) {


                    document
                        .getElementById(
                            "videoFrame"
                        )
                        .src =
                        "https://www.youtube.com/embed/"
                        + videoId;


                    document
                        .getElementById(
                            "videoContainer"
                        )
                        .style.display =
                        "block";


                }


            }


        }


        function getYouTubeVideoId(url) {


            const regex =
                /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([^&?\/]+)/;


            const match =
                url.match(regex);


            return match
                ? match[1]
                : null;


        }


        loadBlog();


    </script>


</body>

</html>
