<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog | Akkhil Kapoor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #111827;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .blog-detail {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .blog-detail img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .content {
            font-size: 18px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .video {
            margin-top: 30px;
        }

        .video iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .loading,
        .error {
            text-align: center;
            padding: 40px;
        }

    </style>

</head>


<body>


    <div class="container">


        <a
            href="blog.html"
            class="back-btn"
        >
            ← Back to Blogs
        </a>


        <div
            id="blogContainer"
            class="blog-detail"
        >

            <div class="loading">
                Loading blog...
            </div>

        </div>


    </div>



    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- SUPABASE CONFIG -->

    <script src="js/supabase-config.js"></script>



    <script>


        async function loadBlog() {


            const blogContainer =
                document.getElementById(
                    "blogContainer"
                );


            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            const slug =
                urlParams.get("slug");


            if (!slug) {


                blogContainer.innerHTML = `

                    <div class="error">

                        Blog not found.

                    </div>

                `;


                return;


            }


            const {

                data: blog,

                error

            } =
                await supabaseClient
                    .from("blogs")
                    .select("*")
                    .eq(
                        "slug",
                        slug
                    )
                    .eq(
                        "is_published",
                        true
                    )
                    .single();


            if (error || !blog) {


                blogContainer.innerHTML = `

                    <div class="error">

                        Blog not found.

                    </div>

                `;


                return;


            }


            let imageHTML =
                "";


            if (blog.image_url) {


                imageHTML = `

                    <img

                        src="${blog.image_url}"

                        alt="${blog.title}"

                    >

                `;


            }



            let videoHTML =
                "";


            if (blog.video_url) {


                let videoId =
                    "";


                if (
                    blog.video_url.includes(
                        "watch?v="
                    )
                ) {


                    videoId =
                        blog.video_url
                            .split(
                                "watch?v="
                            )[1]
                            .split(
                                "&"
                            )[0];


                }


                else if (
                    blog.video_url.includes(
                        "youtu.be/"
                    )
                ) {


                    videoId =
                        blog.video_url
                            .split(
                                "youtu.be/"
                            )[1]
                            .split(
                                "?"
                            )[0];


                }


                if (videoId) {


                    videoHTML = `

                        <div class="video">

                            <iframe

                                src="https://www.youtube.com/embed/${videoId}"

                                allowfullscreen

                            ></iframe>

                        </div>

                    `;


                }


            }



            blogContainer.innerHTML = `

                ${imageHTML}

                <h1>

                    ${blog.title}

                </h1>


                <div class="content">

                    ${blog.content}

                </div>


                ${videoHTML}

            `;


            document.title =
                blog.title
                + " | Akkhil Kapoor";


        }


        loadBlog();


    </script>


</body>

</html>
