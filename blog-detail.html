    <!-- ===============================

    =============================== -->

    <script>


        /*
        =====================================
        DOM ELEMENT
        =====================================
        */


        const blogContainer =
            document.getElementById(
                "blogContainer"
            );


        /*
        =====================================
        LOAD BLOG
        =====================================
        */


        async function loadBlog() {


            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            const slug =
                urlParams.get(
                    "slug"
                );


            console.log(
                "Blog Slug:",
                slug
            );


            if (!slug) {


                showError(
                    "Blog not found."
                );


                return;

            }


            try {


                const {

                    data: blogs,

                    error

                } = await supabaseClient

                    .from("blogs")

                    .select("*")

                    .eq(
                        "slug",
                        slug
                    )

                    .eq(
                        "is_published",
                        true
                    )

                    .limit(1);


                console.log(
                    "Blog Data:",
                    blogs
                );


                console.log(
                    "Supabase Error:",
                    error
                );


                if (error) {


                    throw error;

                }


                if (
                    !blogs
                    ||
                    blogs.length === 0
                ) {


                    showError(
                        "Blog not found."
                    );


                    return;

                }


                const blog =
                    blogs[0];


                let imageHTML =
                    "";


                if (
                    blog.image_url
                ) {


                    imageHTML = `

                        <img

                            src="${escapeHTML(
                                blog.image_url
                            )}"

                            alt="${escapeHTML(
                                blog.title
                            )}"

                            class="blog-detail-image"

                        >

                    `;

                }


                let dateHTML =
                    "";


                if (
                    blog.created_at
                ) {


                    const date =
                        new Date(
                            blog.created_at
                        );


                    dateHTML = `

                        <div
                            class="blog-date"
                        >

                            <i
                                class="far fa-calendar-alt"
                            ></i>

                            ${date.toLocaleDateString(

                                "en-IN",

                                {

                                    day:
                                        "numeric",

                                    month:
                                        "long",

                                    year:
                                        "numeric"

                                }

                            )}

                        </div>

                    `;

                }


                let videoHTML =
                    "";


                if (
                    blog.video_url
                ) {


                    const videoId =
                        getYouTubeVideoId(
                            blog.video_url
                        );


                    if (
                        videoId
                    ) {


                        videoHTML = `

                            <div
                                class="blog-video"
                            >

                                <h3>

                                    <i
                                        class="fab fa-youtube"
                                    ></i>

                                    Related Video

                                </h3>


                                <iframe

                                    src="https://www.youtube.com/embed/${videoId}"

                                    title="${escapeHTML(
                                        blog.title
                                    )}"

                                    allowfullscreen

                                ></iframe>

                            </div>

                        `;

                    }

                }


                blogContainer.innerHTML = `


                    <a

                        href="blog.html"

                        class="back-to-blogs"

                    >

                        <i
                            class="fas fa-arrow-left"
                        ></i>

                        Back to Blogs

                    </a>


                    <h1
                        class="blog-detail-title"
                    >

                        ${escapeHTML(
                            blog.title
                        )}

                    </h1>


                    ${dateHTML}


                    ${imageHTML}


                    <div
                        class="blog-detail-content"
                    >

                        ${blog.content}

                    </div>


                    ${videoHTML}


                    <div id="blogReactions"></div>

                `;


                updateSEO(
                    blog,
                    slug
                );


                renderReactions(
                    blog
                );


            }

            catch (error) {


                console.error(
                    "Error loading blog:",
                    error
                );


                showError(
                    "Failed to load blog. Please try again later."
                );

            }

        }


        /*
        =====================================
        UPDATE SEO TAGS DYNAMICALLY
        =====================================
        */


        function updateSEO(
            blog,
            slug
        ) {


            const plainDescription =
                stripHTML(
                    blog.content
                )
                .trim()
                .substring(
                    0,
                    160
                );


            const pageUrl =
                "https://akkhilkapoor.github.io/akkhil/blog-detail.html?slug="
                + encodeURIComponent(
                    slug
                );


            const imageUrl =
                blog.image_url
                ||
                "https://akkhilkapoor.github.io/akkhil/akkhil.jpg";


            const fullTitle =
                blog.title
                +
                " | Akkhil Kapoor";


            document.title =
                fullTitle;


            document
                .getElementById(
                    "pageTitle"
                )
                .textContent =
                    fullTitle;


            document
                .getElementById(
                    "metaDescription"
                )
                .setAttribute(
                    "content",
                    plainDescription
                );


            document
                .getElementById(
                    "canonicalLink"
                )
                .setAttribute(
                    "href",
                    pageUrl
                );


            document
                .getElementById(
                    "ogTitle"
                )
                .setAttribute(
                    "content",
                    fullTitle
                );


            document
                .getElementById(
                    "ogDescription"
                )
                .setAttribute(
                    "content",
                    plainDescription
                );


            document
                .getElementById(
                    "ogUrl"
                )
                .setAttribute(
                    "content",
                    pageUrl
                );


            document
                .getElementById(
                    "ogImage"
                )
                .setAttribute(
                    "content",
                    imageUrl
                );


            document
                .getElementById(
                    "twitterTitle"
                )
                .setAttribute(
                    "content",
                    fullTitle
                );


            document
                .getElementById(
                    "twitterDescription"
                )
                .setAttribute(
                    "content",
                    plainDescription
                );


            document
                .getElementById(
                    "twitterImage"
                )
                .setAttribute(
                    "content",
                    imageUrl
                );


            const schema = {

                "@context":
                    "https://schema.org",

                "@type":
                    "Article",

                "headline":
                    blog.title,

                "description":
                    plainDescription,

                "image":
                    imageUrl,

                "author": {

                    "@type":
                        "Person",

                    "name":
                        "Akkhil Kapoor"

                },

                "publisher": {

                    "@type":
                        "Organization",

                    "name":
                        "Akkhil Kapoor"

                },

                "datePublished":
                    blog.created_at
                    ||
                    "",

                "mainEntityOfPage": {

                    "@type":
                        "WebPage",

                    "@id":
                        pageUrl

                }

            };


            document
                .getElementById(
                    "articleSchema"
                )
                .textContent =
                    JSON.stringify(
                        schema
                    );

        }


        /*
        =====================================
        LIKE / DISLIKE REACTIONS
        =====================================
        */


        function renderReactions(
            blog
        ) {


            const reactionsBox =
                document.getElementById(
                    "blogReactions"
                );


            let likes =
                blog.likes || 0;


            let dislikes =
                blog.dislikes || 0;


            const voteKey =
                "vote_" + blog.slug;


            let currentVote =
                localStorage.getItem(
                    voteKey
                );


            function draw() {


                reactionsBox.innerHTML = `

                    <div class="blog-reactions">

                        <span class="blog-reactions-label">

                            Was this helpful?

                        </span>


                        <button
                            id="likeBtn"
                            class="reaction-btn ${

                                currentVote === "like"
                                    ? "active-like"
                                    : ""

                            }"
                        >

                            <i class="fas fa-thumbs-up"></i>

                            <span id="likeCount">${likes}</span>

                        </button>


                        <button
                            id="dislikeBtn"
                            class="reaction-btn ${

                                currentVote === "dislike"
                                    ? "active-dislike"
                                    : ""

                            }"
                        >

                            <i class="fas fa-thumbs-down"></i>

                            <span id="dislikeCount">${dislikes}</span>

                        </button>

                    </div>

                `;


                document
                    .getElementById(
                        "likeBtn"
                    )
                    .addEventListener(
                        "click",
                        function () {

                            handleVote(
                                "like"
                            );

                        }
                    );


                document
                    .getElementById(
                        "dislikeBtn"
                    )
                    .addEventListener(
                        "click",
                        function () {

                            handleVote(
                                "dislike"
                            );

                        }
                    );

            }


            async function handleVote(
                type
            ) {


                let likeDelta = 0;

                let dislikeDelta = 0;


                if (
                    currentVote === type
                ) {


                    /* USER CLICKED THE SAME BUTTON AGAIN -> REMOVE VOTE */


                    if (type === "like") {

                        likeDelta = -1;
                        likes -= 1;

                    } else {

                        dislikeDelta = -1;
                        dislikes -= 1;

                    }


                    currentVote = null;


                    localStorage.removeItem(
                        voteKey
                    );


                }

                else if (
                    currentVote === null
                ) {


                    /* NO PREVIOUS VOTE */


                    if (type === "like") {

                        likeDelta = 1;
                        likes += 1;

                    } else {

                        dislikeDelta = 1;
                        dislikes += 1;

                    }


                    currentVote = type;


                    localStorage.setItem(
                        voteKey,
                        type
                    );


                }

                else {


                    /* SWITCHING VOTE */


                    if (type === "like") {

                        likeDelta = 1;
                        dislikeDelta = -1;
                        likes += 1;
                        dislikes -= 1;

                    } else {

                        likeDelta = -1;
                        dislikeDelta = 1;
                        likes -= 1;
                        dislikes += 1;

                    }


                    currentVote = type;


                    localStorage.setItem(
                        voteKey,
                        type
                    );


                }


                draw();


                const { error } =
                    await supabaseClient.rpc(
                        "adjust_blog_reaction",
                        {

                            blog_id:
                                blog.id,

                            like_delta:
                                likeDelta,

                            dislike_delta:
                                dislikeDelta

                        }
                    );


                if (error) {

                    console.error(
                        "Error updating reaction:",
                        error
                    );

                }

            }


            draw();

        }


        /*
        =====================================
        YOUTUBE VIDEO ID
        =====================================
        */


        function getYouTubeVideoId(
            url
        ) {


            let videoId =
                "";


            try {


                const urlObject =
                    new URL(
                        url
                    );


                if (

                    urlObject.hostname.includes(
                        "youtube.com"
                    )

                ) {


                    videoId =
                        urlObject.searchParams.get(
                            "v"
                        );

                }


                else if (

                    urlObject.hostname.includes(
                        "youtu.be"
                    )

                ) {


                    videoId =
                        urlObject.pathname.substring(
                            1
                        );

                }


            }

            catch (error) {


                console.error(
                    "Invalid YouTube URL"
                );

            }


            return videoId;

        }


        /*
        =====================================
        SHOW ERROR
        =====================================
        */


        function showError(
            message
        ) {


            blogContainer.innerHTML = `


                <div
                    class="blog-error"
                >

                    <i
                        class="fas fa-exclamation-triangle"
                    ></i>


                    <h2>

                        ${message}

                    </h2>


                    <a

                        href="blog.html"

                        class="back-to-blogs"

                    >

                        Back to Blogs

                    </a>

                </div>

            `;

        }


        /*
        =====================================
        ESCAPE HTML
        =====================================
        */


        function escapeHTML(
            text
        ) {


            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text
                ||
                "";


            return div.innerHTML;

        }


        /*
        =====================================
        STRIP HTML (FOR META DESCRIPTION)
        =====================================
        */


        function stripHTML(
            html
        ) {


            const div =
                document.createElement(
                    "div"
                );


            div.innerHTML =
                html
                ||
                "";


            return (
                div.textContent
                ||
                div.innerText
                ||
                ""
            );

        }


        /*
        =====================================
        MOBILE MENU
        =====================================
        */


        const mobileMenuBtn =
            document.getElementById(
                "mobileMenuBtn"
            );


        const mainNav =
            document.getElementById(
                "mainNav"
            );


        mobileMenuBtn.addEventListener(

            "click",

            function() {


                mainNav.classList.toggle(
                    "open"
                );


                const icon =
                    mobileMenuBtn.querySelector(
                        "i"
                    );


                if (

                    mainNav.classList.contains(
                        "open"
                    )

                ) {


                    icon.classList.remove(
                        "fa-bars"
                    );


                    icon.classList.add(
                        "fa-times"
                    );

                }

                else {


                    icon.classList.remove(
                        "fa-times"
                    );


                    icon.classList.add(
                        "fa-bars"
                    );

                }

            }

        );


        /*
        =====================================
        START
        =====================================
        */


        loadBlog();


    </script>
