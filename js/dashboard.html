<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Akkhil Kapoor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        #publishBtn {
            margin-top: 20px;
            padding: 13px 25px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>

<body>


    <header>

        <h2>Blog Admin Dashboard</h2>

        <button id="logoutBtn">
            Logout
        </button>

    </header>


    <div class="container">

        <div class="card">

            <h3>Add New Blog</h3>


            <form id="blogForm">


                <label>
                    Blog Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter blog title"
                    required
                >


                <label>
                    Blog Content
                </label>

                <textarea
                    id="content"
                    placeholder="Write your blog content here..."
                    required
                ></textarea>


                <label>
                    Image URL
                </label>

                <input
                    type="url"
                    id="image_url"
                    placeholder="https://example.com/image.jpg"
                >


                <label>
                    YouTube Video URL
                </label>

                <input
                    type="url"
                    id="video_url"
                    placeholder="https://youtube.com/watch?v=..."
                >


                <button
                    type="submit"
                    id="publishBtn"
                >
                    Publish Blog
                </button>


            </form>


            <div id="message"></div>

        </div>

    </div>


    <!-- Supabase Library -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase Configuration -->

    <script src="js/supabase-config.js"></script>


    <script>


        // Check Login

        async function checkUser() {

            const {
                data: { user }
            } = await supabaseClient.auth.getUser();


            if (!user) {

                window.location.href = "admin.html";

            }

        }


        checkUser();


        // Logout

        document
            .getElementById("logoutBtn")
            .addEventListener("click", async function () {


                await supabaseClient.auth.signOut();


                window.location.href = "admin.html";


            });


        // Add Blog

        document
            .getElementById("blogForm")
            .addEventListener("submit", async function (event) {


                event.preventDefault();


                const title =
                    document
                        .getElementById("title")
                        .value
                        .trim();


                const content =
                    document
                        .getElementById("content")
                        .value
                        .trim();


                const image_url =
                    document
                        .getElementById("image_url")
                        .value
                        .trim();


                const video_url =
                    document
                        .getElementById("video_url")
                        .value
                        .trim();


                const message =
                    document
                        .getElementById("message");


                message.textContent =
                    "Publishing blog...";


                const {
                    data: { user }
                } =
                    await supabaseClient.auth.getUser();


                if (!user) {

                    window.location.href =
                        "admin.html";

                    return;

                }


                const { data, error } =
                    await supabaseClient
                        .from("blogs")
                        .insert([

                            {

                                title: title,

                                content: content,

                                image_url: image_url || null,

                                video_url: video_url || null,

                                is_published: true

                            }

                        ]);


                if (error) {

                    message.textContent =
                        "Error: " + error.message;

                    return;

                }


                message.textContent =
                    "Blog published successfully!";


                document
                    .getElementById("blogForm")
                    .reset();


            });


    </script>


</body>

</html>
